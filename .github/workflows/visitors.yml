name: Update Visitor Count

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch visitors from Google Analytics
        run: |
          pip install -q google-auth requests
          python .github/scripts/ga_visitors.py
        env:
          GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_START_DATE: '2026-11-19'
          OUT: out/visitors.json
      - name: Publish to the visitor-stats branch
        run: |
          cd out
          git init -q -b visitor-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visitors.json
          git commit -q -m "Update visitor count"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:visitor-stats
